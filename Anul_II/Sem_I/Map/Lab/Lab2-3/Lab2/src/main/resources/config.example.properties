# copie a lui config.properties (config.properties nu se urca pe git)
# pentru rulare: copiaza fisierul ca config.properties; la db.password pui parola utilizatorului postgres de la instalare

# tipul de persistenta: MEMORY, FILE, DATABASE
repository.type=DATABASE

# FILE: caile fisierelor, relative la folderul proiectului
file.utilizatori=data/utilizatori.txt
file.prietenii=data/prietenii.txt

# DATABASE: baza de date PostgreSQL socialnetwork (tabelele din sql/socialnetwork.sql), port implicit 5432
db.url=jdbc:postgresql://localhost:5432/socialnetwork
db.user=postgres
db.password=postgres
